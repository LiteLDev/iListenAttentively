on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Cache XMake
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Update XMake Repositories
        run: |
          xmake repo -u

      - name: Configure
        run: |
          xmake f -a x64 -m release -p windows -v -y

      - name: Build
        run: |
          xmake -v -y

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-x64-${{ github.sha }}
          path: |
            bin/DLL
      
      - name: Upload PDB
        uses: actions/upload-artifact@v4
        with:
          name: PDB-${{ github.sha }}
          path: |
            bin/PDB

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: SDK-${{ github.sha }}
          path: |
            bin/SDK